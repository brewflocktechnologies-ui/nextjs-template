name: CI

# Not running yet: GitHub push and CI are deferred (SPECS/DECISIONS.md D-22). `pnpm verify` runs the
# same steps locally. Keep this file and tools/scripts/verify.mjs in step.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    # P2.1-T14: the same Postgres image and digest as compose.yaml (check-compose-pinned).
    services:
      db:
        image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_USER: byteflock
          POSTGRES_PASSWORD: byteflock
          POSTGRES_DB: byteflock
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U byteflock -d byteflock"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Local Nx cache only (no Nx Cloud, D-08). Keys are immutable, so the commit SHA is part
      # of the key and restore-keys pick up the newest cache for this branch, then any branch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # A service cannot mount the init script, so the roles and the test database come from
      # the same SQL file through db:bootstrap; then migrations and the seed.
      - name: Database (roles, migrations, seed)
        run: |
          node tools/scripts/db/bootstrap.mjs
          node tools/scripts/db/migrate.mjs
          node tools/scripts/db/seed.mjs

      - name: Policy checks
        run: pnpm policy:check

      - name: Format check (changed files)
        if: github.event_name == 'pull_request'
        run: pnpm nx format:check --base=origin/${{ github.base_ref }} --head=HEAD

      - name: Format check (all files)
        if: github.event_name != 'pull_request'
        run: pnpm nx format:check --all

      - name: TypeScript project references in sync
        run: pnpm nx sync:check

      # Generated files are committed; every generator exposes build:check (P1.2 onwards).
      - name: Generated files up to date
        run: pnpm nx run-many -t build:check

      - name: Lint, test, typecheck, build (affected)
        if: github.event_name == 'pull_request'
        run: pnpm nx affected -t lint test typecheck build --base=origin/${{ github.base_ref }} --head=HEAD

      - name: Storybook builds and story tests (affected)
        if: github.event_name == 'pull_request'
        run: pnpm nx affected -t build-storybook test-storybook --base=origin/${{ github.base_ref }} --head=HEAD

      - name: End-to-end, Chromium (affected)
        if: github.event_name == 'pull_request'
        run: pnpm nx affected -t e2e --parallel=1 --base=origin/${{ github.base_ref }} --head=HEAD -- --project=chromium

      - name: Lint, test, typecheck, build (all)
        if: github.event_name != 'pull_request'
        run: pnpm nx run-many -t lint test typecheck build

      - name: Storybook builds and story tests (all)
        if: github.event_name != 'pull_request'
        run: pnpm nx run-many -t build-storybook test-storybook

      - name: End-to-end, Chromium (all)
        if: github.event_name != 'pull_request'
        run: pnpm nx run-many -t e2e --parallel=1 -- --project=chromium

  # D-17: Windows is a first-class development environment.
  widget-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium

      - name: Build the widget
        run: pnpm nx run @byteflock/widget:build

      - name: Playground smoke test
        run: pnpm nx run @byteflock/widget-playground:e2e -- --project=chromium --grep @smoke

  # P1.7-T03: visual regression in the pinned Linux Playwright image, the same one `pnpm visual`
  # uses locally (tools/scripts/visual.mjs). Snapshots are *-linux.png; blocking.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    # The job runs in a container, so the database is reached by its service name.
    # P2.1-T14: the same Postgres image and digest as compose.yaml (check-compose-pinned).
    services:
      db:
        image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_USER: byteflock
          POSTGRES_PASSWORD: byteflock
          POSTGRES_DB: byteflock
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U byteflock -d byteflock"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      VISUAL: '1'
      DATABASE_URL: postgres://byteflock_app:byteflock_app@db:5432/byteflock
      MIGRATE_DATABASE_URL: postgres://byteflock:byteflock@db:5432/byteflock
      RECREATE_ADMIN_URL: postgres://byteflock:byteflock@db:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      # A service cannot mount the init script, so the roles and the test database come from
      # the same SQL file through db:bootstrap; then migrations and the seed.
      - name: Database (roles, migrations, seed)
        run: |
          node tools/scripts/db/bootstrap.mjs
          node tools/scripts/db/migrate.mjs
          node tools/scripts/db/seed.mjs
      - name: Playground snapshots
        run: pnpm exec playwright test -c apps/widget-playground/playwright.config.mts --project=chromium --grep @visual
      - name: Dashboard snapshots
        run: pnpm exec playwright test -c apps/admin-dashboard-e2e/playwright.config.mts --project=chromium --grep @visual
