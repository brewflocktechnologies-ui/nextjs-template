name: CI

# Not running yet: GitHub push and CI are deferred (SPECS/DECISIONS.md D-22).
# D-26: every job runs `pnpm verify` with a profile; no gate command lives in this file. Each job
# uploads its reports/ folder, and the `report` job merges them into one quality report (job
# summary and the `quality-report` artifact).

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    # P2.1-T14: the same Postgres image and digest as compose.yaml (check-compose-pinned).
    services:
      db:
        image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_USER: byteflock
          POSTGRES_PASSWORD: byteflock
          POSTGRES_DB: byteflock
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U byteflock -d byteflock"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      BYTEFLOCK_RUN_LABEL: Linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Local Nx cache only (no Nx Cloud, D-08). Keys are immutable, so the commit SHA is part
      # of the key and restore-keys pick up the newest cache for this branch, then any branch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Database (db:bootstrap, migrate, seed), policy, format, sync, generated files, lint, test,
      # typecheck, build, Storybook and Chromium e2e: the steps of tools/scripts/verify.mjs.
      - name: Gates (affected)
        if: github.event_name == 'pull_request'
        run: pnpm verify --affected --base=origin/${{ github.base_ref }}

      - name: Gates (all)
        if: github.event_name != 'pull_request'
        run: pnpm verify

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gates-linux
          path: reports/
          if-no-files-found: ignore

  # D-17: Windows is a first-class development environment.
  widget-windows:
    runs-on: windows-latest
    env:
      BYTEFLOCK_RUN_LABEL: Windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium

      # Widget build with its bundle assertions, then the playground @smoke tests.
      - name: Gates (Windows)
        run: pnpm verify --profile=windows

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gates-windows
          path: reports/
          if-no-files-found: ignore

  # P1.7-T03: visual regression in the pinned Linux Playwright image, the same one `pnpm visual`
  # uses locally (tools/scripts/visual.mjs). Snapshots are *-linux.png; blocking.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    # The job runs in a container, so the database is reached by its service name.
    # P2.1-T14: the same Postgres image and digest as compose.yaml (check-compose-pinned).
    services:
      db:
        image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_USER: byteflock
          POSTGRES_PASSWORD: byteflock
          POSTGRES_DB: byteflock
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U byteflock -d byteflock"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      VISUAL: '1'
      BYTEFLOCK_RUN_LABEL: Visual (Linux container)
      DATABASE_URL: postgres://byteflock_app:byteflock_app@db:5432/byteflock
      MIGRATE_DATABASE_URL: postgres://byteflock:byteflock@db:5432/byteflock
      RECREATE_ADMIN_URL: postgres://byteflock:byteflock@db:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile

      # Database (db:bootstrap, migrate, seed), then the @visual snapshots of both suites.
      - name: Gates (visual)
        run: pnpm verify --profile=visual

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gates-visual
          path: reports/
          if-no-files-found: ignore

  # D-26: one report for the whole run.
  report:
    needs: [lint-test-build, widget-windows, visual]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: gates-*
          path: all-reports

      # report.mjs needs only Node; a job whose folder is missing is reported as missing.
      - name: Quality report
        run: node tools/scripts/report.mjs all-reports/gates-linux all-reports/gates-windows all-reports/gates-visual --out=quality-report.md --summary

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report
          path: |
            quality-report.md
            all-reports/
