name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      # Local Nx cache only (no Nx Cloud, D-08). Keys are immutable, so the commit SHA is part
      # of the key and restore-keys pick up the newest cache for this branch, then any branch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.ref_name }}-
            nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Policy checks
        run: npm run policy:check

      - name: Format check (changed files)
        if: github.event_name == 'pull_request'
        run: npx nx format:check --base=origin/${{ github.base_ref }} --head=HEAD

      - name: Format check (all files)
        if: github.event_name != 'pull_request'
        run: npx nx format:check --all

      - name: Lint, test, typecheck, build (affected)
        if: github.event_name == 'pull_request'
        run: npx nx affected -t lint test typecheck build --base=origin/${{ github.base_ref }} --head=HEAD

      - name: End-to-end, Chromium (affected)
        if: github.event_name == 'pull_request'
        run: npx nx affected -t e2e --base=origin/${{ github.base_ref }} --head=HEAD -- --project=chromium

      - name: Lint, test, typecheck, build (all)
        if: github.event_name != 'pull_request'
        run: npx nx run-many -t lint test typecheck build

      - name: End-to-end, Chromium (all)
        if: github.event_name != 'pull_request'
        run: npx nx run-many -t e2e -- --project=chromium
